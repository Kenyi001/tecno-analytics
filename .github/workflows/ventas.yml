name: Ventas del ciclo

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ventas-ciclo
  cancel-in-progress: false

jobs:
  extraer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Instalar el trabajo
        run: npm ci
      - name: Instalar Chrome
        run: npx puppeteer browsers install chrome
      - name: Entrar, pedir ventas y subir el día
        run: node reportes/ventas/run.mjs
        env:
          DCR_USER: ${{ secrets.DCR_USER }}
          DCR_PASSWORD: ${{ secrets.DCR_PASSWORD }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
